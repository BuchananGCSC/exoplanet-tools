name: physics tests

# Runs on every push and pull request, and blocks nothing that is not
# already broken. The point is simple: if this badge is red, do not
# deploy, because the simulator's numbers are wrong.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the physics test suite
        run: node --test
